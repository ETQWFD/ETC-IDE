<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ETC 后台</title>
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080d1f;color:#dfe6f5;font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
a{color:#4fc1ff;text-decoration:none}
.hide{display:none}
.login{max-width:340px;margin:18vh auto;background:#101a3c;border:1px solid #22305c;border-radius:14px;padding:34px 30px}
.login h1{font-size:20px;color:#9fd4ff;text-align:center;margin-bottom:22px;letter-spacing:2px}
.login label{display:block;color:#8fa3cf;font-size:13px;margin:14px 0 6px}
.login input{width:100%;padding:10px 12px;background:#0a1130;border:1px solid #2a3a66;border-radius:8px;color:#e8efff;font-size:14px;outline:none}
.login input:focus{border-color:#4fc1ff}
.login button{width:100%;margin-top:22px;padding:11px;background:linear-gradient(135deg,#1e3a8a,#312e81);border:1px solid #4f7cff;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.err{color:#ff7a7a;font-size:13px;text-align:center;margin-top:14px;min-height:18px}
.wrap{max-width:1100px;margin:0 auto;padding:26px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.top h1{font-size:24px;color:#9fd4ff;letter-spacing:2px}
.top .right{display:flex;gap:10px;align-items:center}
.btn{padding:9px 18px;border-radius:8px;background:#15214a;border:1px solid #2a3a66;color:#e8efff;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:#4fc1ff;background:#1d2f66}
.btn.logout{color:#ff9a9a;border-color:#5c2a2a}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.card{background:#101a3c;border:1px solid #22305c;border-radius:12px;padding:18px 20px}
.card .n{font-size:30px;font-weight:800;color:#4fc1ff}
.card .l{font-size:13px;color:#7d8db1;margin-top:4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.chart{background:#101a3c;border:1px solid #22305c;border-radius:12px;padding:16px 18px}
.chart h3{font-size:14px;color:#9fd4ff;margin-bottom:8px;letter-spacing:1px}
.chart .hint{font-size:12px;color:#5d6d94;margin-top:6px}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.leg span{font-size:12px;color:#aab8dd}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;background:#101a3c;border:1px solid #22305c;border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #1d294e;white-space:nowrap}
th{color:#7d8db1;font-weight:600;background:#0d1533}
td{color:#cdd9f0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#15214a}
.empty{color:#5d6d94;text-align:center;padding:28px;font-size:13.5px}
.live{margin-bottom:22px}
.live iframe{margin-top:10px}
.src{color:#5d6d94;font-size:12.5px;margin:10px 2px}
.foot{color:#44537d;font-size:12px;text-align:center;margin-top:26px}
@media(max-width:720px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login" id="loginBox">
<h1>ETC 管理后台</h1>
<label>用户名</label>
<input id="u" autocomplete="username" value="root">
<label>密码</label>
<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()">
<button onclick="tryLogin()">进入后台</button>
<div class="err" id="err"></div>
</div>

<div class="wrap hide" id="dash">
<div class="top">
<h1>ETC IDE 下载后台</h1>
<div class="right">
<span class="src" id="srcInfo"></span>
<button class="btn" id="refreshBtn" onclick="loadAll(true)">刷新数据</button>
<button class="btn logout" onclick="logout()">退出</button>
</div>
</div>

<div class="cards">
<div class="card"><div class="n" id="cTotal">0</div><div class="l">下载人次</div></div>
<div class="card"><div class="n" id="cPeople">0</div><div class="l">去重人数</div></div>
<div class="card"><div class="n" id="cToday">0</div><div class="l">今日下载</div></div>
<div class="card"><div class="n" id="cPressure">0</div><div class="l">近 1 小时压力</div></div>
</div>

<div class="charts">
<div class="chart">
<h3>下载省份分布</h3>
<svg id="donutProv" width="280" height="220"></svg>
<div class="leg" id="legProv"></div>
</div>
<div class="chart">
<h3>时段访问压力</h3>
<svg id="donutHour" width="280" height="220"></svg>
<div class="leg" id="legHour"></div>
<div class="hint">按下载时间统计：凌晨 / 上午 / 下午 / 晚上</div>
</div>
</div>

<div class="live">
<button class="btn" id="liveBtn" onclick="toggleLive()">查看实时原始记录</button>
<div class="hide" id="liveBox">
<iframe id="liveFrame" src="https://webhook.site/#!/view/42853fcd-ad57-4e48-9b85-7f0bd2c6bf75" style="width:100%;height:420px;border:1px solid #22305c;border-radius:10px;background:#0d1533"></iframe>
</div>
</div>

<table id="tbl">
<thead><tr><th>时间</th><th>IP</th><th>省份</th><th>城市</th><th>文件</th><th>设备</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<div class="foot">© 2026 ET · 数据来自 webhook.site 真实采集 · 每 5 分钟自动同步</div>
</div>

<script>
(function(){
var HASH="03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
var TOKEN="42853fcd-ad57-4e48-9b85-7f0bd2c6bf75";
var WEBHOOK_READ="https://webhook.site/token/"+TOKEN+"/requests?sorting=newest&per_page=200";
var PROXIES=[
"https://corsproxy.io/?url=",
"https://api.allorigins.win/raw?url=",
"https://api.codetabs.com/v1/proxy?quest="
];
var PALETTE=["#4fc1ff","#a78bfa","#f472b6","#fbbf24","#34d399","#60a5fa","#f87171","#2dd4bf","#c084fc","#94a3b8"];
var state={records:[],src:"",updated:""};

function sha256(s){
  function rrot(x,n){return (x>>>n)|(x<<(32-n));}
  function hex(x){var h="0123456789abcdef",o="";for(var i=0;i<8;i++){o+=h.charAt((x>>>28)&15)+h.charAt((x>>>24)&15)+h.charAt((x>>>20)&15)+h.charAt((x>>>16)&15)+h.charAt((x>>>12)&15)+h.charAt((x>>>8)&15)+h.charAt((x>>>4)&15)+h.charAt(x&15);}return o;}
  var m=s+"\u0080";while(m.length%64!==56)m+="\u0000";
  var l=s.length*8;m=m.slice(0,-8);
  m+=String.fromCharCode((l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);
  m+=String.fromCharCode(0,0,0,0);
  var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  for(var i=0;i<m.length;i+=64){
    var w=[];
    for(var j=0;j<16;j++)w[j]=((m.charCodeAt(i+j*4)<<24)|(m.charCodeAt(i+j*4+1)<<16)|(m.charCodeAt(i+j*4+2)<<8)|m.charCodeAt(i+j*4+3))>>>0;
    for(j=16;j<64;j++){
      var s0=rrot(w[j-15],7)^rrot(w[j-15],18)^(w[j-15]>>>3);
      var s1=rrot(w[j-2],17)^rrot(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;
    }
    var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
    for(j=0;j<64;j++){
      var S1=rrot(e,6)^rrot(e,11)^rrot(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(hh+S1+ch+K[j]+w[j])>>>0;
      var S0=rrot(a,2)^rrot(a,13)^rrot(a,22);
      var maj=(a&b)^(a&c)^(b&c);
      var t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;
    h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+hh)>>>0;
  }
  return hex(h0)+hex(h1)+hex(h2)+hex(h3)+hex(h4)+hex(h5)+hex(h6)+hex(h7);
}
function tryLogin(){
  var u=document.getElementById("u").value.trim();
  var p=document.getElementById("p").value;
  if(u==="root"&&sha256(p)===HASH){
    sessionStorage.setItem("etc_admin","1");
    document.getElementById("loginBox").classList.add("hide");
    document.getElementById("dash").classList.remove("hide");
    loadAll(false);
  }else{
    document.getElementById("err").textContent="用户名或密码错误";
  }
}
function logout(){
  sessionStorage.removeItem("etc_admin");
  location.reload();
}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(t){
  if(t==null)return Date.now();
  if(typeof t==="number")return t;
  var d=new Date(t);
  return isNaN(d.getTime())?Date.now():d.getTime();
}
function fmt(ms){
  var d=new Date(ms),p=function(n){return(n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function parseWebhook(data){
  var list=Array.isArray(data)?data:(data&&data.data?data.data:[]);
  var out=[];
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if(r.method!=="POST")continue;
    var c={};
    try{c=JSON.parse(r.content||"{}");}catch(e){}
    if(!c||c.action!=="download")continue;
    out.push({ip:r.ip||c.ip||"",province:c.province||"",city:c.city||"",file:c.file||"",ua:c.ua||"",t:norm(c.t||r.created_at)});
  }
  return out;
}
function donut(svgId,legId,items){
  var svg=document.getElementById(svgId);
  var leg=document.getElementById(legId);
  svg.innerHTML="";leg.innerHTML="";
  var total=0;
  for(var i=0;i<items.length;i++)total+=items[i].v;
  if(total===0){
    svg.innerHTML='<text x="140" y="115" fill="#5d6d94" font-size="13" text-anchor="middle">暂无数据</text>';
    return;
  }
  var cx=140,cy=110,r=74,sw=26;
  var ns="http://www.w3.org/2000/svg";
  var start=-Math.PI/2;
  var g=document.createElementNS(ns,"g");
  for(i=0;i<items.length;i++){
    var frac=items[i].v/total;
    var a1=start,a2=start+frac*Math.PI*2;
    var large=frac>0.5?1:0;
    var x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    var x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    var p=document.createElementNS(ns,"path");
    p.setAttribute("d","M "+x1.toFixed(2)+" "+y1.toFixed(2)+" A "+r+" "+r+" 0 "+large+" 1 "+x2.toFixed(2)+" "+y2.toFixed(2));
    p.setAttribute("fill","none");
    p.setAttribute("stroke",PALETTE[i%PALETTE.length]);
    p.setAttribute("stroke-width",sw);
    p.setAttribute("stroke-linecap","round");
    g.appendChild(p);
    start=a2;
    var li=document.createElement("span");
    li.innerHTML='<i style="background:'+PALETTE[i%PALETTE.length]+'"></i>'+esc(items[i].k)+" "+items[i].v;
    leg.appendChild(li);
  }
  svg.appendChild(g);
  var center=document.createElementNS(ns,"text");
  center.setAttribute("x",cx);center.setAttribute("y",cy+5);
  center.setAttribute("text-anchor","middle");
  center.setAttribute("fill","#4fc1ff");
  center.setAttribute("font-size","22");
  center.setAttribute("font-weight","bold");
  center.textContent=total;
  svg.appendChild(center);
}
function render(){
  var rec=state.records;
  var total=rec.length;
  var ips={},today=0,phour=0,prov={},hour={0:0,1:0,2:0,3:0};
  var now=Date.now();
  for(var i=0;i<rec.length;i++){
    var r=rec[i];
    ips[r.ip||"unknown"]=1;
    if(now-r.t<86400000)today++;
    if(now-r.t<3600000)phour++;
    var p=r.province||"未知";
    prov[p]=prov[p]||0;prov[p]++;
    var hh=new Date(r.t).getHours();
    if(hh>=0&&hh<6)hour[0]++;else if(hh<12)hour[1]++;else if(hh<18)hour[2]++;else hour[3]++;
  }
  document.getElementById("cTotal").textContent=total;
  document.getElementById("cPeople").textContent=Object.keys(ips).length;
  document.getElementById("cToday").textContent=today;
  document.getElementById("cPressure").textContent=phour;
  var provArr=[];
  for(var k in prov)provArr.push({k:k,v:prov[k]});
  provArr.sort(function(a,b){return b.v-a.v;});
  if(provArr.length>8)provArr=provArr.slice(0,8);
  donut("donutProv","legProv",provArr);
  donut("donutHour","legHour",[
    {k:"凌晨 0-6",v:hour[0]},
    {k:"上午 6-12",v:hour[1]},
    {k:"下午 12-18",v:hour[2]},
    {k:"晚上 18-24",v:hour[3]}
  ]);
  var tb=document.getElementById("tbody");
  tb.innerHTML="";
  if(rec.length===0){
    tb.innerHTML='<tr><td colspan="6" class="empty">暂无下载记录，等待第一个下载者</td></tr>';
  }else{
    for(i=0;i<rec.length;i++){
      var r=rec[i];
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+fmt(r.t)+"</td><td>"+esc(r.ip)+"</td><td>"+esc(r.province||"未知")+"</td><td>"+esc(r.city||"-")+"</td><td>"+esc(r.file)+"</td><td>"+esc((r.ua||"-").slice(0,60))+"</td>";
      tb.appendChild(tr);
    }
  }
  document.getElementById("srcInfo").textContent="数据源: "+state.src+(state.updated?" · 同步于 "+state.updated:"");
}
function fetchJSON(url,timeout){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open("GET",url);
    x.timeout=timeout||10000;
    x.onload=function(){if(x.status===200)res(x.responseText);else rej(new Error(x.status));};
    x.onerror=function(){rej(new Error("net"));};
    x.ontimeout=function(){rej(new Error("timeout"));};
    x.send();
  });
}
function loadStatsJson(){
  return fetchJSON("stats.json",8000).then(function(t){
    var j=JSON.parse(t);
    state.records=(j&&j.records)||[];
    state.src="stats.json 同步";
    state.updated=j.updated||"";
    render();
  });
}
function loadLive(){
  var q=encodeURIComponent(WEBHOOK_READ);
  var tried=false;
  function next(i){
    if(i>=PROXIES.length)return;
    fetchJSON(PROXIES[i]+q,7000).then(function(t){
      var rec=parseWebhook(JSON.parse(t));
      if(rec.length>0){
        state.records=rec;
        state.src="webhook 实时";
        state.updated="";
        render();
      }
    }).catch(function(){next(i+1);});
  }
  next(0);
}
function loadAll(manual){
  document.getElementById("refreshBtn").disabled=true;
  loadStatsJson().catch(function(){
    state.src="同步文件暂不可用";
    render();
  }).then(function(){
    loadLive();
    document.getElementById("refreshBtn").disabled=false;
  });
}
function toggleLive(){
  var b=document.getElementById("liveBox");
  b.classList.toggle("hide");
  document.getElementById("liveBtn").textContent=b.classList.contains("hide")?"查看实时原始记录":"收起实时原始记录";
}
if(sessionStorage.getItem("etc_admin")==="1"){
  document.getElementById("loginBox").classList.add("hide");
  document.getElementById("dash").classList.remove("hide");
  loadAll(false);
}
window.tryLogin=tryLogin;
window.logout=logout;
window.loadAll=loadAll;
window.toggleLive=toggleLive;
})();
</script>
</body>
</html>
