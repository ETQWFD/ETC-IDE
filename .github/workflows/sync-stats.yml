name: sync-stats
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: sync
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python3 _sync.py
      - name: push
        run: |
          git config user.name "ETC-Bot"
          git config user.email "etc@etqwfd.github.io"
          git add stats.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "sync stats"; git push; fi
